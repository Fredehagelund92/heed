# Secret scanning (.github/workflows/security.yml): gitleaks' default rules over the whole history,
# and the private-profile marker (docs/security.md#private-profiles).

[extend]
useDefault = true

# A file from a private profile: real company data kept outside every checkout, each file marked.
# The bracket keeps this file from carrying the marker itself; the security workflow proves the rule
# on a file it writes with the marker and one without.
[[rules]]
id = "heed-private-profile"
description = "A file from a private profile, which never belongs in this repository"
regex = '''HEED-PRIVATE-PROFIL[E]'''
keywords = ["heed-private-profil"]

[[rules.allowlists]]
description = "The page that explains the marker names it"
paths = ['''^docs/security\.md$''']

[[allowlists]]
description = "The made-up AWS key the content-safety tests must recognise (FR-117)"
condition = "AND"
paths = ['''^tests/server/domain/draft\.test\.ts$''']
regexes = ['''AKIA1234567890ABCDEF''']

[[allowlists]]
description = "Fake test fixture: the made-up GitLab token the Sources e2e spec types into the add-a-source form"
condition = "AND"
paths = ['''^tests/e2e/sources\.spec\.ts$''']
regexes = ['''^glpat-e2e-readonly-''']

[[allowlists]]
description = "Fake test fixture: the made-up idempotency key in the Sources integration test"
condition = "AND"
paths = ['''^tests/integration/sources\.test\.ts$''']
regexes = ['''a1b2c3d4e5f60718293a4b5c6d7e8f90''']

[[allowlists]]
description = "Not a secret: the generated digest of the OpenAPI document (scripts/generate-api.ts). The file is deleted, but the scan covers the whole history, so the entry must stay"
condition = "AND"
paths = ['''^src/web/api/api-version\.json$''']
regexes = ['''^[0-9a-f]{16}$''']
