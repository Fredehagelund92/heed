# The golden set: what agents must be given, and what a good answer does, on the golden library
# (the 1,500 demo items of generateItems() with seed 20261007, then the fixtures of
# db/seed/golden-fixtures.ts). DEMO DATA ONLY. The format and the checks are in
# src/domain/golden-set.ts; the plan is the output test plan, section 2.
#
# How a case was made: its items were picked by a selection query over the library (named in
# `source`), its wordings written without reading the item text beyond its scope (the leakage
# lint in tests/server/domain/golden-set.test.ts refuses a shared phrase), and its expected
# outcome set from L1 alone, before any model answered it. After the first real run a case
# changes only with a reason in `notes` and a new `version` here.
#
# These are the development cases. Held-out cases are sealed in db/seed/golden-held-out.age, which
# only the key holder can open (README, "The sealed held-out cases"): nobody who changes Heed's
# prompts, tools or scoring may see them, and no case here is held out. None are sealed at present.
#
# L1 (tests/integration/golden-set.test.ts) runs every case here in CI with no model, and the
# held-out cases too, as counts only, where they are sealed and the key is given.

# Version 16 (21 October 2026): the program that reads the facts is the agent, not the AI app, and
# three tools say fact in their ids: get_context is get_facts, find_context is find_facts and
# search_context is search_facts. The cases change only in those words: the tool names they expect,
# the three rubrics and the help case's page address (connect-an-agent). Their expectations are
# otherwise the same. The `source` lines keep the captain's words as he said them on 15 October.
# Version 17 (26 October 2026): the agent contract (docs/product.md, section 10). L1 reads what
# agents get from get_context, the tool that replaced get_facts, with response_format full (the
# concise case reads the concise reply, the agent contract's default), and its status now carries
# the answer state (src/domain/answer-state.ts): stale (Outdated) where an item that applies may be
# out of date, and partial (Partial) where no item covers the whole question. 26 statuses in 23
# cases change to that; every delivery, rank, version and phrase is the same. A question read at
# today (no dates given) is Partial, so two of those statuses are partial. Two rubrics name
# get_context. The assistant's cases keep their tool names: the assistant keeps its tools.
# Version 18 (30 October 2026): the in-app assistant is gone (the web app's Ask answers on the
# answer engine), and its cases with it. The agent cases are the same.
version: 18
library:
  seed: 20261007
  items: 1500
  fixtures: db/seed/golden-fixtures.ts

