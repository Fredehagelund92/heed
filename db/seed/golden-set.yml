          tools_none: [create_draft]
          asks_no_scope: true
          forbidden_phrases: ['About our business says', 'according to About our business']
        rubrics:
          - 'Says a first-time buyer is a customer whose first paid order falls in the period, whenever they signed up'
          - 'Cites no fact for the meaning and does not claim Heed holds a definition of first-time buyer that no tool result gave'
    source: "Captain, 15 Oct 2026: the assistant should not start from level zero on the business's own words"

