    source: 'Library: the metric group Revenue, which holds three metrics'
    notes: 'Version 3: get_context reads a metric group (group:revenue) as its three metrics, so it delivers the items of gross sales, net revenue and units sold (one of each named here) instead of no_match. Version 10: Haiku gave revenue as one figure in round 6 (0 of 6), so say names the three metrics of the group and each item names the ones it is about (about).'

