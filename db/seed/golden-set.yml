# The golden set: what agents must be given, and what a good answer does, on the golden library
# (the 1,500 demo items of generateItems() with seed 20261007, then the fixtures of
# db/seed/golden-fixtures.ts). DEMO DATA ONLY. The format and the checks are in
# src/domain/golden-set.ts; the plan is the output test plan, section 2.
#
# How a case was made: its items were picked by a selection query over the library (named in
# `source`), its wordings written without reading the item text beyond its scope (the leakage
# lint in tests/server/domain/golden-set.test.ts refuses a shared phrase), and its expected
# outcome set from L1 alone, before any model answered it. After the first real run a case
# changes only with a reason in `notes` and a new `version` here.
#
# These are the development cases. Held-out cases are sealed in db/seed/golden-held-out.age, which
# only the key holder can open (README, "The sealed held-out cases"): nobody who changes Heed's
# prompts, tools or scoring may see them, and no case here is held out. None are sealed at present.
#
# L1 (tests/integration/golden-set.test.ts) runs every case here in CI with no model, and the
# held-out cases too, as counts only, where they are sealed and the key is given.

version: 15
library:
  seed: 20261007
  items: 1500
  fixtures: db/seed/golden-fixtures.ts

cases:
  # ---- 1. Baseline lookup with a caveat: answer, cite, keep the caveat. ------------------------
  - id: gs-baseline-orders-united-kingdom
    area: area_sales
    type: baseline
    behaviour: answer
    as_of: '2026-10-07'
    wordings:
      - kind: natural
        text: How much did customers spend in the United Kingdom this past week?
      - kind: precise
        text: What should an analyst know about orders for market United Kingdom from 1 to 7 October 2026?
    scope:
      metrics: [metric:orders]
      dimension_filters:
        - dimension: dim:market
          values: [val:market/united_kingdom]
      window:
        from: '2026-10-01'
        to: '2026-10-07'
    delivery:
      status: matched
      must_deliver: [itm_yakb4kwg]
      must_not_deliver: [itm_9omvkhl1]
      rank_max: 8
      text: [test accounts]
    answer:
      must_cite: [itm_yakb4kwg]
      caveat: Orders excludes test accounts.
    source: 'Re-worded seed question orders-united-kingdom-test-accounts: a note on the metric and market, still in force'
    notes: "L1.4 finding kept on purpose: the note comes 7th of 9 (rank_max 8, plan section 6). A weak model must pick it out of the noise. Version 9: every domain is served (14 Oct 2026), so the items of every domain rank with it. Version 15: the demo world's words (a retailer), with the same expectations."

