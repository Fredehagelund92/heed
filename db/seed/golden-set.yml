  # ---- The captain's pilot: a domain that holds nothing yet, named by another spelling. ---------
  # Visible on purpose, like the meta cases. The captain, 15 October 2026: a domain was created
  # with a typo in its name and its Cube members were never proposed as terms. Asked for the
  # domain's metrics and dimensions by its right spelling, the assistant listed the other domains'
  # terms and the practice terms, never said Cube had the domain's members waiting, answered the
  # correction with "nothing changes" and "I did understand you", and repeated the same block. The
  # golden library has such a domain: "Stores & Suplliers" (db/seed/golden-fixtures.ts), with two
  # metrics and a dimension of Cube mapped to it and no term.
  - id: pilot-empty-domain-stored-name
    origin: new
    type: pilot
    as_of: '2026-10-07'
    turns:
      - say: show me Stores & Suplliers metrics and dimensions
        expect:
          tools_any: [domain_overview, find_context]
          asks_no_scope: true
          forbidden_phrases: [invented, I did understand, nothing changes]
        rubrics:
          - 'Says the Stores & Suplliers domain has no items and no vocabulary terms yet'
          - "Says Cube has 2 metrics and 1 dimension mapped to the domain that are not in Heed's vocabulary yet, and names at least one of them"
          - 'Gives one next step: an administrator proposes them as terms in Administration, Sources'
          - 'Lists no metric, dimension or item of another domain'
          - 'Answers in a few sentences, not a long list'
    source: "Captain, 15 Oct 2026: show me a domain's metrics and dimensions by its stored name"

