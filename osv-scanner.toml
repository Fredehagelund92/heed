# Reviewed exceptions for OSV-Scanner, the dependency gate in .github/workflows/security.yml.
# Each entry says why the finding does not reach the running service, and expires so that it is
# reviewed again. Only add one when no fixed version exists or the fix would break the service.

[[IgnoredVulns]]
id = "GHSA-jmr9-qjv8-65gv"
ignoreUntil = 2027-01-08
reason = "extract-zip: symlink path traversal in a hostile archive. @cubejs-backend/shared 1.7.39 loads it but the offline compiler never extracts anything; Cube's post-installer uses it at install time on Cube's own release archive, and the compile worker runs with file writes denied. No version has a fix. Cube 1.8 drops it, but upgrading the compiler changes every change mark (docs/connectors/cube.md), so it waits for a stable mark."

