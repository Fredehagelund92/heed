# Item template: copy this file, replace the three worked examples with your own items, then
#
#   npm run heed -- import my-items.yaml --as <your email>           # dry run: checks only
#   npm run heed -- import my-items.yaml --apply --as <your email>   # proposals, sent for review
#
# (`--drafts` with `--apply` keeps them as drafts.) `heed` talks to http://127.0.0.1:3000; name
# another service with --url. An import never publishes anything: each item becomes a suggestion
# that the domain's owner publishes in Heed. The web app's editor and an agent's suggest_context
# make the same suggestions. A law or a regulation has a template of its own:
# docs/templates/regulatory-event.yaml. To turn lessons or instructions you already have into this
# format, see convert-lessons.md.
#
# The examples are about the demo data (`npm run seed`, or `docker compose up`): orders and
# markets in its Sales domain. They describe no real business, so on a database with the demo they pass the dry run
# as they are.
#
# What goes in (the pilot's data rule): metric and dimension names, dates, launches, tracking
# changes, known data breaks and caveats in your own words. Never partner or customer names,
# personal data, revenue or other figures, contract terms or secrets; the checks refuse text that
# looks like an email address, a phone number, a key or a password. Only write what a model could
# not know from the data: definitions stay in Cube.
#
# Every field: `npm run heed -- schema`. The ones you need:
#   title          what an agent reads first, up to 200 characters
#   areaId         the domain's id; needed when the scope's metrics belong to no one domain
#   kind           note (a standing caveat), issue (a problem with a window), event (something
#                  that happened), guide or example; a note when left out
#   summary        the caveat itself, 1 to 3 sentences. Or summaryMarkup, the same text with
#                  mentions: @[words](target), target metric:<key>, dim:<key>, val:<dim>/<value>,
#                  item:<id> or area:<id>
#   body           optional detail, or bodyMarkup with mentions
#   scope          where it applies, in the live vocabulary's keys: metrics (metric: or group:),
#                  dimensionValues ({dimension, value}) and dimensions (a dimension with any of
#                  its values: broad, so the reviewer is told). At least one.
#   validity       start, and end (null when it has none)
#   reviewDate     when the owner checks it again; needed when end is null, null otherwise
#   evidence       at least one source: url, a sentence quoted from it, the day you read it
#   riskLevel      low, normal or high. Be honest, and know the cost: low needs no answer test;
#                  normal runs a paid impact test before it can be accepted, high a full one.
#   claimLevel     fact_only (a fact, no cause proven), or effect_stated with claimAuthority (who
#                  states the effect) and claimQuote (their words)
#   notToConclude  optional, the form's "What not to conclude": what someone might wrongly conclude
#                  from it, in one or two plain sentences. Start with "It doesn't tell you ...",
#                  "Don't use this for ..." or "Check with ...". Left out: cause not proven.
#
# Left out, Heed fills in: the domain (from the scope's metrics, when they name one), the owner (the domain's
# owner), the kind, the risk (low for a note), the claim level and a review date in 90 days.
# A change to an accepted item names its id (`id: itm_...`) and only the fields that change.

items:
  # 1. A standing caveat: no end date, so it needs a review date. Mentions link the metric.
  - title: 'Example: orders count an order when it is paid, not when it is placed'
    kind: note
    areaId: area_sales
    summaryMarkup: >-
      @[Orders](metric:orders) counts an order on the day it is paid, so an order placed late on
      the last day of a month can count in the next month.
    body: An example on the demo data; it describes no real business.
    scope:
      metrics: [metric:orders]
      dimensions: []
      dimensionValues: []
    validity: { start: '2026-09-01', end: null }
    reviewDate: '2027-01-15'
    evidence:
      - url: https://example.test/demo/order-handbook
        quote: An order is counted when its payment clears
        date: '2026-09-01'
    riskLevel: low
    claimLevel: fact_only
    notToConclude: It doesn't tell you how many orders were placed in a month.

  # 2. A known data break with a window: an issue for one market, ending on a set day.
  - title: 'Example: Spain orders were counted twice for three days'
    kind: issue
    areaId: area_sales
    summary: >-
      A checkout fault counted some Spain orders twice for three days, so orders in Spain are too
      high for those days and should not be compared with other weeks.
    scope:
      metrics: [metric:orders]
      dimensions: []
      dimensionValues:
        - { dimension: dim:market, value: val:market/spain }
    validity: { start: '2026-09-14', end: '2026-09-16' }
    reviewDate: null
    evidence:
      - url: https://example.test/demo/incident-log
        quote: Duplicate Spain orders removed after a three-day checkout fault
        date: '2026-09-17'
    riskLevel: low
    claimLevel: fact_only
    notToConclude: High orders those days do not mean more people bought. Don't compare them with other weeks.

  # 3. An event whose effect someone named has stated: effect_stated needs who and their words.
  - title: 'Example: Norway had free delivery from October'
    kind: event
    areaId: area_sales
    summary: >-
      Norway has free delivery on every order from 1 October, and the Nordic sales team says it
      brings more small orders.
    scope:
      metrics: [metric:orders, metric:units_sold]
      dimensions: []
      dimensionValues:
        - { dimension: dim:market, value: val:market/norway }
    validity: { start: '2026-10-01', end: null }
    reviewDate: '2027-01-31'
    evidence:
      - url: https://example.test/demo/delivery-terms
        quote: From 1 October delivery in Norway is free on every order
        date: '2026-09-25'
    riskLevel: low
    claimLevel: effect_stated
    claimAuthority: The Nordic sales team
    claimQuote: Free delivery brings in the small orders
    notToConclude: Free delivery is not proven to explain any other change
