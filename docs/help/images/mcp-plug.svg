<svg xmlns="http://www.w3.org/2000/svg" class="hf" width="640" height="262" viewBox="0 0 640 262" role="img">
  <title>The plug: agents, MCP and the systems that offer tools</title>
  <style>
    .hf { --hf-ink: #13161d; --hf-muted: #60636a; --hf-paper: #ffffff; --hf-soft: #f2f3f6; --hf-line: #d9dbe0; --hf-accent: #2c5dbd; --hf-on-accent: #ffffff; --hf-tint: #e1ecff; }
    @media (prefers-color-scheme: dark) {
      .hf { --hf-ink: #f4f5f8; --hf-muted: #a1a4ac; --hf-paper: #1c1e24; --hf-soft: #25272e; --hf-line: #3a3d45; --hf-accent: #4170cb; --hf-on-accent: #ffffff; --hf-tint: #1f2734; }
    }
    .hf text { font-family: var(--font-sans, system-ui, -apple-system, 'Segoe UI', sans-serif); font-size: 13px; fill: var(--foreground, var(--hf-ink)); }
    .hf .hf-mono { font-family: var(--font-mono, ui-monospace, 'SF Mono', monospace); }
    .hf .hf-title { font-size: 14px; font-weight: 700; }
    .hf .hf-muted { fill: var(--muted-foreground, var(--hf-muted)); }
    .hf .hf-on-accent { fill: var(--primary-foreground, var(--hf-on-accent)); font-weight: 700; }
    .hf .hf-box { fill: var(--card, var(--hf-paper)); stroke: var(--input, var(--hf-line)); stroke-width: 1; }
    .hf .hf-soft { fill: var(--muted, var(--hf-soft)); stroke: none; }
    .hf .hf-key { fill: var(--selected, var(--hf-tint)); stroke: var(--primary, var(--hf-accent)); stroke-width: 1.5; }
    .hf .hf-accent { fill: var(--primary, var(--hf-accent)); stroke: none; }
    .hf .hf-line { fill: none; stroke: var(--muted-foreground, var(--hf-muted)); stroke-width: 1.5; }
    .hf .hf-dash { stroke-dasharray: 4 4; }
    .hf .hf-head { fill: var(--muted-foreground, var(--hf-muted)); stroke: none; }
    .hf .hf-label-bg { fill: var(--background, var(--hf-paper)); stroke: none; }
  </style>
  <rect class="hf-box" x="16" y="24" width="160" height="36" rx="8"/>
  <text x="32" y="47">Claude Code</text>
  <path class="hf-line" d="M176 42 L272 42"/>
  <rect class="hf-box" x="16" y="76" width="160" height="36" rx="8"/>
  <text x="32" y="99">Claude app</text>
  <path class="hf-line" d="M176 94 L272 94"/>
  <rect class="hf-box" x="16" y="128" width="160" height="36" rx="8"/>
  <text x="32" y="151">Cursor</text>
  <path class="hf-line" d="M176 146 L272 146"/>
  <rect class="hf-box" x="16" y="180" width="160" height="36" rx="8"/>
  <text x="32" y="203">ChatGPT</text>
  <path class="hf-line" d="M176 198 L272 198"/>
  <rect class="hf-accent" x="272" y="24" width="72" height="192" rx="8"/>
  <text class="hf-on-accent" x="308" y="125" text-anchor="middle">MCP</text>
  <rect class="hf-key" x="448" y="24" width="176" height="52" rx="8"/>
  <text class="hf-title" x="464" y="46">{{product}}</text>
  <text class="hf-muted" x="464" y="65">the facts</text>
  <path class="hf-line" d="M344 50 L448 50"/>
  <rect class="hf-box" x="448" y="96" width="176" height="52" rx="8"/>
  <text class="hf-title" x="464" y="118">Your data tool</text>
  <text class="hf-muted" x="464" y="137">the number</text>
  <path class="hf-line" d="M344 122 L448 122"/>
  <rect class="hf-box" x="448" y="168" width="176" height="52" rx="8"/>
  <text class="hf-title" x="464" y="190">Other systems</text>
  <text class="hf-muted" x="464" y="209">files, tickets, code</text>
  <path class="hf-line" d="M344 194 L448 194"/>
  <text class="hf-muted" x="96" y="250" text-anchor="middle">Agents</text>
  <text class="hf-muted" x="308" y="250" text-anchor="middle">the plug</text>
  <text class="hf-muted" x="536" y="250" text-anchor="middle">MCP servers</text>
</svg>
