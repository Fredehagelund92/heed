<svg xmlns="http://www.w3.org/2000/svg" class="hf" width="640" height="236" viewBox="0 0 640 236" role="img">
  <title>The life of a fact, from draft to agents</title>
  <style>
    .hf { --hf-ink: #13161d; --hf-muted: #60636a; --hf-paper: #ffffff; --hf-soft: #f2f3f6; --hf-line: #d9dbe0; --hf-accent: #2c5dbd; --hf-on-accent: #ffffff; --hf-tint: #e1ecff; }
    @media (prefers-color-scheme: dark) {
      .hf { --hf-ink: #f4f5f8; --hf-muted: #a1a4ac; --hf-paper: #1c1e24; --hf-soft: #25272e; --hf-line: #3a3d45; --hf-accent: #4170cb; --hf-on-accent: #ffffff; --hf-tint: #1f2734; }
    }
    .hf text { font-family: var(--font-sans, system-ui, -apple-system, 'Segoe UI', sans-serif); font-size: 13px; fill: var(--foreground, var(--hf-ink)); }
    .hf .hf-mono { font-family: var(--font-mono, ui-monospace, 'SF Mono', monospace); }
    .hf .hf-title { font-size: 14px; font-weight: 700; }
    .hf .hf-muted { fill: var(--muted-foreground, var(--hf-muted)); }
    .hf .hf-on-accent { fill: var(--primary-foreground, var(--hf-on-accent)); font-weight: 700; }
    .hf .hf-box { fill: var(--card, var(--hf-paper)); stroke: var(--input, var(--hf-line)); stroke-width: 1; }
    .hf .hf-soft { fill: var(--muted, var(--hf-soft)); stroke: none; }
    .hf .hf-key { fill: var(--selected, var(--hf-tint)); stroke: var(--primary, var(--hf-accent)); stroke-width: 1.5; }
    .hf .hf-accent { fill: var(--primary, var(--hf-accent)); stroke: none; }
    .hf .hf-line { fill: none; stroke: var(--muted-foreground, var(--hf-muted)); stroke-width: 1.5; }
    .hf .hf-dash { stroke-dasharray: 4 4; }
    .hf .hf-head { fill: var(--muted-foreground, var(--hf-muted)); stroke: none; }
    .hf .hf-label-bg { fill: var(--background, var(--hf-paper)); stroke: none; }
  </style>
  <rect class="hf-box" x="8" y="64" width="112" height="52" rx="8"/>
  <text class="hf-title" x="64" y="95" text-anchor="middle">Draft</text>
  <rect class="hf-box" x="136" y="64" width="112" height="52" rx="8"/>
  <text class="hf-title" x="192" y="86" text-anchor="middle">Waiting</text>
  <text class="hf-title" x="192" y="104" text-anchor="middle">for review</text>
  <rect class="hf-box" x="264" y="64" width="112" height="52" rx="8"/>
  <text class="hf-title" x="320" y="95" text-anchor="middle">In review</text>
  <rect class="hf-box" x="392" y="64" width="112" height="52" rx="8"/>
  <text class="hf-title" x="448" y="95" text-anchor="middle">Accepted</text>
  <rect class="hf-key" x="520" y="64" width="112" height="52" rx="8"/>
  <text class="hf-title" x="576" y="86" text-anchor="middle">Agents</text>
  <text class="hf-title" x="576" y="104" text-anchor="middle">get it</text>
  <path class="hf-line" d="M120 90 L137.0 90.0"/>
  <path class="hf-head" d="M144.0 90.0 L136.0 94.5 L136.0 85.5 Z"/>
  <path class="hf-line" d="M248 90 L265.0 90.0"/>
  <path class="hf-head" d="M272.0 90.0 L264.0 94.5 L264.0 85.5 Z"/>
  <path class="hf-line" d="M376 90 L393.0 90.0"/>
  <path class="hf-head" d="M400.0 90.0 L392.0 94.5 L392.0 85.5 Z"/>
  <path class="hf-line" d="M504 90 L521.0 90.0"/>
  <path class="hf-head" d="M528.0 90.0 L520.0 94.5 L520.0 85.5 Z"/>
  <text class="hf-muted" x="56" y="48" text-anchor="middle">you write</text>
  <text class="hf-muted" x="192" y="48" text-anchor="middle">you send it</text>
  <text class="hf-muted" x="320" y="48" text-anchor="middle">the owner</text>
  <text class="hf-muted" x="448" y="48" text-anchor="middle">one yes</text>
  <text class="hf-muted" x="576" y="48" text-anchor="middle">at once</text>
  <rect class="hf-soft" x="136" y="176" width="112" height="52" rx="8"/>
  <text x="192" y="198" text-anchor="middle">Changes</text>
  <text x="192" y="216" text-anchor="middle">requested</text>
  <rect class="hf-soft" x="264" y="176" width="112" height="52" rx="8"/>
  <text x="320" y="207" text-anchor="middle">Withdrawn</text>
  <rect class="hf-soft" x="392" y="176" width="112" height="52" rx="8"/>
  <text x="448" y="207" text-anchor="middle">Rejected</text>
  <rect class="hf-soft" x="520" y="176" width="112" height="52" rx="8"/>
  <text x="576" y="198" text-anchor="middle">Needs checking</text>
  <text class="hf-muted" x="576" y="216" text-anchor="middle">Agents get it</text>
  <path class="hf-line hf-dash" d="M290 116 L236.9 171.0"/>
  <path class="hf-head" d="M232.0 176.0 L234.3 167.1 L240.8 173.4 Z"/>
  <path class="hf-line hf-dash" d="M176 176 L176.0 123.0"/>
  <path class="hf-head" d="M176.0 116.0 L180.5 124.0 L171.5 124.0 Z"/>
  <text class="hf-muted" x="168" y="150" text-anchor="end">again</text>
  <path class="hf-line hf-dash" d="M320 116 L320.0 169.0"/>
  <path class="hf-head" d="M320.0 176.0 L315.5 168.0 L324.5 168.0 Z"/>
  <path class="hf-line hf-dash" d="M350 116 L414.7 171.4"/>
  <path class="hf-head" d="M420.0 176.0 L411.0 174.2 L416.9 167.4 Z"/>
  <path class="hf-line hf-dash" d="M576 116 L576.0 169.0"/>
  <path class="hf-head" d="M576.0 176.0 L571.5 168.0 L580.5 168.0 Z"/>
</svg>
