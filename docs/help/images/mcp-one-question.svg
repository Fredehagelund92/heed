<svg xmlns="http://www.w3.org/2000/svg" class="hf" width="640" height="328" viewBox="0 0 640 328" role="img">
  <title>One question: you, your agent, Cube and {{product}}</title>
  <style>
    .hf { --hf-ink: #13161d; --hf-muted: #60636a; --hf-paper: #ffffff; --hf-soft: #f2f3f6; --hf-line: #d9dbe0; --hf-accent: #2c5dbd; --hf-on-accent: #ffffff; --hf-tint: #e1ecff; }
    @media (prefers-color-scheme: dark) {
      .hf { --hf-ink: #f4f5f8; --hf-muted: #a1a4ac; --hf-paper: #1c1e24; --hf-soft: #25272e; --hf-line: #3a3d45; --hf-accent: #4170cb; --hf-on-accent: #ffffff; --hf-tint: #1f2734; }
    }
    .hf text { font-family: var(--font-sans, system-ui, -apple-system, 'Segoe UI', sans-serif); font-size: 13px; fill: var(--foreground, var(--hf-ink)); }
    .hf .hf-mono { font-family: var(--font-mono, ui-monospace, 'SF Mono', monospace); }
    .hf .hf-title { font-size: 14px; font-weight: 700; }
    .hf .hf-muted { fill: var(--muted-foreground, var(--hf-muted)); }
    .hf .hf-on-accent { fill: var(--primary-foreground, var(--hf-on-accent)); font-weight: 700; }
    .hf .hf-box { fill: var(--card, var(--hf-paper)); stroke: var(--input, var(--hf-line)); stroke-width: 1; }
    .hf .hf-soft { fill: var(--muted, var(--hf-soft)); stroke: none; }
    .hf .hf-key { fill: var(--selected, var(--hf-tint)); stroke: var(--primary, var(--hf-accent)); stroke-width: 1.5; }
    .hf .hf-accent { fill: var(--primary, var(--hf-accent)); stroke: none; }
    .hf .hf-line { fill: none; stroke: var(--muted-foreground, var(--hf-muted)); stroke-width: 1.5; }
    .hf .hf-dash { stroke-dasharray: 4 4; }
    .hf .hf-head { fill: var(--muted-foreground, var(--hf-muted)); stroke: none; }
    .hf .hf-label-bg { fill: var(--background, var(--hf-paper)); stroke: none; }
  </style>
  <rect class="hf-box" x="16" y="16" width="128" height="36" rx="8"/>
  <text class="hf-title" x="80" y="39" text-anchor="middle">You</text>
  <path class="hf-line hf-dash" d="M80 52 L80 324"/>
  <rect class="hf-box" x="176" y="16" width="128" height="36" rx="8"/>
  <text class="hf-title" x="240" y="39" text-anchor="middle">Your agent</text>
  <path class="hf-line hf-dash" d="M240 52 L240 324"/>
  <rect class="hf-box" x="336" y="16" width="128" height="36" rx="8"/>
  <text class="hf-title" x="400" y="39" text-anchor="middle">Cube</text>
  <path class="hf-line hf-dash" d="M400 52 L400 324"/>
  <rect class="hf-key" x="496" y="16" width="128" height="36" rx="8"/>
  <text class="hf-title" x="560" y="39" text-anchor="middle">{{product}}</text>
  <path class="hf-line hf-dash" d="M560 52 L560 324"/>
  <path class="hf-line" d="M80 96 L233.0 96.0"/>
  <path class="hf-head" d="M240.0 96.0 L232.0 100.5 L232.0 91.5 Z"/>
  <rect class="hf-label-bg" x="103.1" y="72" width="113.8" height="18"/>
  <circle class="hf-accent" cx="113.1" cy="81" r="10"/>
  <text class="hf-on-accent" x="113.1" y="85.5" text-anchor="middle">1</text>
  <text x="129.1" y="86">Your question</text>
  <path class="hf-line" d="M240 140 L393.0 140.0"/>
  <path class="hf-head" d="M400.0 140.0 L392.0 144.5 L392.0 135.5 Z"/>
  <rect class="hf-label-bg" x="246.6" y="116" width="146.8" height="18"/>
  <circle class="hf-accent" cx="256.6" cy="125" r="10"/>
  <text class="hf-on-accent" x="256.6" y="129.5" text-anchor="middle">2</text>
  <text x="272.6" y="130">Ask for the number</text>
  <path class="hf-line hf-dash" d="M400 172 L247.0 172.0"/>
  <path class="hf-head" d="M240.0 172.0 L248.0 167.5 L248.0 176.5 Z"/>
  <rect class="hf-label-bg" x="283.0" y="148" width="74.0" height="18"/>
  <text class="hf-muted" x="320.0" y="162" text-anchor="middle">the figure</text>
  <path class="hf-line" d="M240 216 L553.0 216.0"/>
  <path class="hf-head" d="M560.0 216.0 L552.0 220.5 L552.0 211.5 Z"/>
  <rect class="hf-label-bg" x="305.3" y="192" width="189.4" height="18"/>
  <circle class="hf-accent" cx="315.3" cy="201" r="10"/>
  <text class="hf-on-accent" x="315.3" y="205.5" text-anchor="middle">3</text>
  <text x="331.3" y="206">Get facts for a question</text>
  <path class="hf-line hf-dash" d="M560 260 L247.0 260.0"/>
  <path class="hf-head" d="M240.0 260.0 L248.0 255.5 L248.0 264.5 Z"/>
  <rect class="hf-label-bg" x="250.7" y="236" width="298.6" height="18"/>
  <circle class="hf-accent" cx="260.70000000000005" cy="245" r="10"/>
  <text class="hf-on-accent" x="260.70000000000005" y="249.5" text-anchor="middle">4</text>
  <text x="276.70000000000005" y="250">A note, its source, what not to conclude</text>
  <path class="hf-line" d="M240 304 L87.0 304.0"/>
  <path class="hf-head" d="M80.0 304.0 L88.0 299.5 L88.0 308.5 Z"/>
  <rect class="hf-label-bg" x="93.2" y="280" width="133.6" height="18"/>
  <circle class="hf-accent" cx="103.2" cy="289" r="10"/>
  <text class="hf-on-accent" x="103.2" y="293.5" text-anchor="middle">5</text>
  <text x="119.2" y="294">Answer with both</text>
</svg>
