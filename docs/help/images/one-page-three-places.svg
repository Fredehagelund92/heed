<svg xmlns="http://www.w3.org/2000/svg" class="hf" width="640" height="236" viewBox="0 0 640 236" role="img">
  <title>One help page, three places that answer from it</title>
  <style>
    .hf { --hf-ink: #13161d; --hf-muted: #60636a; --hf-paper: #ffffff; --hf-soft: #f2f3f6; --hf-line: #d9dbe0; --hf-accent: #2c5dbd; --hf-on-accent: #ffffff; --hf-tint: #e1ecff; }
    @media (prefers-color-scheme: dark) {
      .hf { --hf-ink: #f4f5f8; --hf-muted: #a1a4ac; --hf-paper: #1c1e24; --hf-soft: #25272e; --hf-line: #3a3d45; --hf-accent: #4170cb; --hf-on-accent: #ffffff; --hf-tint: #1f2734; }
    }
    .hf text { font-family: var(--font-sans, system-ui, -apple-system, 'Segoe UI', sans-serif); font-size: 13px; fill: var(--foreground, var(--hf-ink)); }
    .hf .hf-title { font-size: 14px; font-weight: 700; }
    .hf .hf-muted { fill: var(--muted-foreground, var(--hf-muted)); }
    .hf .hf-box { fill: var(--card, var(--hf-paper)); stroke: var(--input, var(--hf-line)); stroke-width: 1; }
    .hf .hf-key { fill: var(--selected, var(--hf-tint)); stroke: var(--primary, var(--hf-accent)); stroke-width: 1.5; }
    .hf .hf-line { fill: none; stroke: var(--muted-foreground, var(--hf-muted)); stroke-width: 1.5; }
  </style>
  <rect class="hf-key" x="16" y="72" width="208" height="68" rx="8"/>
  <text class="hf-title" x="32" y="98">A help page</text>
  <text class="hf-muted" x="32" y="120">such as What is an MCP</text>
  <path class="hf-line" d="M224 106 L296 106 L296 46 L392 46"/>
  <path class="hf-line" d="M296 106 L392 106"/>
  <path class="hf-line" d="M296 106 L296 166 L392 166"/>
  <rect class="hf-box" x="392" y="20" width="232" height="52" rx="8"/>
  <text class="hf-title" x="408" y="42">Docs, in {{product}}</text>
  <text class="hf-muted" x="408" y="61">the page itself</text>
  <rect class="hf-box" x="392" y="80" width="232" height="52" rx="8"/>
  <text class="hf-title" x="408" y="102">The assistant</text>
  <text class="hf-muted" x="408" y="121">answers from it, with a link</text>
  <rect class="hf-box" x="392" y="140" width="232" height="52" rx="8"/>
  <text class="hf-title" x="408" y="162">Your agent, over MCP</text>
  <text class="hf-muted" x="408" y="181">answers from it, with a link</text>
  <text class="hf-muted" x="120" y="222" text-anchor="middle">written once</text>
  <text class="hf-muted" x="508" y="222" text-anchor="middle">the same answer in each place</text>
</svg>
