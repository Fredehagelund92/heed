<svg xmlns="http://www.w3.org/2000/svg" class="hf" width="640" height="300" viewBox="0 0 640 300" role="img">
  <title>How Heed fits: AI apps ask over MCP, Heed reads Cube model files and keeps its facts in PostgreSQL</title>
  <style>
    .hf { --hf-ink: #13161d; --hf-muted: #60636a; --hf-paper: #ffffff; --hf-soft: #f2f3f6; --hf-line: #d9dbe0; --hf-accent: #2c5dbd; --hf-on-accent: #ffffff; --hf-tint: #e1ecff; }
    @media (prefers-color-scheme: dark) {
      .hf { --hf-ink: #f4f5f8; --hf-muted: #a1a4ac; --hf-paper: #1c1e24; --hf-soft: #25272e; --hf-line: #3a3d45; --hf-accent: #4170cb; --hf-on-accent: #ffffff; --hf-tint: #1f2734; }
    }
    .hf text { font-family: var(--font-sans, system-ui, -apple-system, 'Segoe UI', sans-serif); font-size: 13px; fill: var(--foreground, var(--hf-ink)); }
    .hf .hf-title { font-size: 14px; font-weight: 700; }
    .hf .hf-muted { fill: var(--muted-foreground, var(--hf-muted)); }
    .hf .hf-page { fill: var(--background, var(--hf-paper)); stroke: none; }
    .hf .hf-box { fill: var(--card, var(--hf-paper)); stroke: var(--input, var(--hf-line)); stroke-width: 1; }
    .hf .hf-soft { fill: var(--muted, var(--hf-soft)); stroke: none; }
    .hf .hf-key { fill: var(--selected, var(--hf-tint)); stroke: var(--primary, var(--hf-accent)); stroke-width: 1.5; }
    .hf .hf-line { fill: none; stroke: var(--muted-foreground, var(--hf-muted)); stroke-width: 1.5; }
    .hf .hf-head { fill: var(--muted-foreground, var(--hf-muted)); stroke: none; }
  </style>
  <rect class="hf-page" x="0" y="0" width="640" height="300" rx="8"/>
  <rect class="hf-box" x="16" y="110" width="124" height="80" rx="8"/>
  <text class="hf-title" x="30" y="135">AI apps</text>
  <text class="hf-muted" x="30" y="160">Claude Code,</text>
  <text class="hf-muted" x="30" y="178">ChatGPT, agents</text>
  <rect class="hf-key" x="184" y="24" width="214" height="252" rx="8"/>
  <text class="hf-title" x="200" y="49">Heed</text>
  <rect class="hf-box" x="200" y="64" width="182" height="56" rx="6"/>
  <text class="hf-title" x="214" y="86">Domains and owners</text>
  <text class="hf-muted" x="214" y="106">who decides what is right</text>
  <rect class="hf-box" x="200" y="132" width="182" height="56" rx="6"/>
  <text class="hf-title" x="214" y="154">Checks</text>
  <text class="hf-muted" x="214" y="174">before an owner accepts</text>
  <rect class="hf-box" x="200" y="200" width="182" height="56" rx="6"/>
  <text class="hf-title" x="214" y="222">Editions</text>
  <text class="hf-muted" x="214" y="242">what AI apps get</text>
  <rect class="hf-box" x="476" y="24" width="148" height="60" rx="8"/>
  <text class="hf-title" x="490" y="49">Cube model files</text>
  <text class="hf-muted" x="490" y="70">metrics, dimensions</text>
  <rect class="hf-box" x="476" y="120" width="148" height="60" rx="8"/>
  <text class="hf-title" x="490" y="145">PostgreSQL</text>
  <text class="hf-muted" x="490" y="166">facts and history</text>
  <rect class="hf-box" x="476" y="216" width="148" height="60" rx="8"/>
  <text class="hf-title" x="490" y="241">Language model</text>
  <text class="hf-muted" x="490" y="262">an admin chooses it</text>
  <path class="hf-line" d="M140 150 L177.0 150.0"/>
  <path class="hf-head" d="M184.0 150.0 L176.0 154.5 L176.0 145.5 Z"/>
  <text class="hf-muted" x="160" y="141" text-anchor="middle">MCP</text>
  <path class="hf-line" d="M476 54 L405.0 54.0"/>
  <path class="hf-head" d="M398.0 54.0 L406.0 49.5 L406.0 58.5 Z"/>
  <text class="hf-muted" x="437" y="45" text-anchor="middle">read only</text>
  <path class="hf-line" d="M398 150 L469.0 150.0"/>
  <path class="hf-head" d="M476.0 150.0 L468.0 145.5 L468.0 154.5 Z"/>
  <text class="hf-muted" x="437" y="141" text-anchor="middle">stores</text>
  <path class="hf-line" d="M398 246 L469.0 246.0"/>
  <path class="hf-head" d="M476.0 246.0 L468.0 241.5 L468.0 250.5 Z"/>
  <text class="hf-muted" x="437" y="223" text-anchor="middle">assistant,</text>
  <text class="hf-muted" x="437" y="238" text-anchor="middle">test runs</text>
</svg>
