<svg xmlns="http://www.w3.org/2000/svg" class="hf" width="640" height="256" viewBox="0 0 640 256" role="img">
  <title>Editions on a line, the one agents get, and the stop switch</title>
  <style>
    .hf { --hf-ink: #13161d; --hf-muted: #60636a; --hf-paper: #ffffff; --hf-soft: #f2f3f6; --hf-line: #d9dbe0; --hf-accent: #2c5dbd; --hf-on-accent: #ffffff; --hf-tint: #e1ecff; }
    @media (prefers-color-scheme: dark) {
      .hf { --hf-ink: #f4f5f8; --hf-muted: #a1a4ac; --hf-paper: #1c1e24; --hf-soft: #25272e; --hf-line: #3a3d45; --hf-accent: #4170cb; --hf-on-accent: #ffffff; --hf-tint: #1f2734; }
    }
    .hf text { font-family: var(--font-sans, system-ui, -apple-system, 'Segoe UI', sans-serif); font-size: 13px; fill: var(--foreground, var(--hf-ink)); }
    .hf .hf-mono { font-family: var(--font-mono, ui-monospace, 'SF Mono', monospace); }
    .hf .hf-title { font-size: 14px; font-weight: 700; }
    .hf .hf-muted { fill: var(--muted-foreground, var(--hf-muted)); }
    .hf .hf-on-accent { fill: var(--primary-foreground, var(--hf-on-accent)); font-weight: 700; }
    .hf .hf-box { fill: var(--card, var(--hf-paper)); stroke: var(--input, var(--hf-line)); stroke-width: 1; }
    .hf .hf-soft { fill: var(--muted, var(--hf-soft)); stroke: none; }
    .hf .hf-key { fill: var(--selected, var(--hf-tint)); stroke: var(--primary, var(--hf-accent)); stroke-width: 1.5; }
    .hf .hf-accent { fill: var(--primary, var(--hf-accent)); stroke: none; }
    .hf .hf-line { fill: none; stroke: var(--muted-foreground, var(--hf-muted)); stroke-width: 1.5; }
    .hf .hf-dash { stroke-dasharray: 4 4; }
    .hf .hf-head { fill: var(--muted-foreground, var(--hf-muted)); stroke: none; }
    .hf .hf-label-bg { fill: var(--background, var(--hf-paper)); stroke: none; }
  </style>
  <path class="hf-line" d="M16 132 L624 132"/>
  <rect class="hf-box" x="16" y="112" width="104" height="40" rx="8"/>
  <text class="hf-mono" x="68.0" y="137" text-anchor="middle">2026-10-01.1</text>
  <rect class="hf-box" x="136" y="112" width="104" height="40" rx="8"/>
  <text class="hf-mono" x="188.0" y="137" text-anchor="middle">2026-10-02.1</text>
  <rect class="hf-box" x="256" y="112" width="104" height="40" rx="8"/>
  <text class="hf-mono" x="308.0" y="137" text-anchor="middle">2026-10-03.1</text>
  <rect class="hf-box" x="376" y="112" width="104" height="40" rx="8"/>
  <text class="hf-mono" x="428.0" y="137" text-anchor="middle">2026-10-07.1</text>
  <rect class="hf-key" x="496" y="112" width="128" height="40" rx="8"/>
  <text class="hf-mono" x="560.0" y="137" text-anchor="middle">2026-10-07.2</text>
  <rect class="hf-accent" x="500" y="160" width="40" height="22" rx="6"/>
  <text class="hf-on-accent" x="520" y="175" text-anchor="middle">Live</text>
  <path class="hf-line" d="M16 84 L433.0 84.0"/>
  <path class="hf-head" d="M440.0 84.0 L432.0 88.5 L432.0 79.5 Z"/>
  <text class="hf-muted" x="16" y="72">Each accepted proposal makes a new edition</text>
  <rect class="hf-box" x="496" y="8" width="128" height="36" rx="8"/>
  <text class="hf-title" x="560" y="31" text-anchor="middle">Your agent</text>
  <path class="hf-line" d="M560 112 L560.0 51.0"/>
  <path class="hf-head" d="M560.0 44.0 L564.5 52.0 L555.5 52.0 Z"/>
  <rect class="hf-box" x="570" y="64" width="28" height="16" rx="8"/>
  <circle class="hf-accent" cx="590" cy="72" r="5"/>
  <text class="hf-muted" x="550" y="77" text-anchor="end">stop switch</text>
  <path class="hf-line hf-dash" d="M560 152 C560 236, 316 236, 312 160"/>
  <path class="hf-head" d="M312.0 154.0 L316.5 162.0 L307.5 162.0 Z"/>
  <text class="hf-muted" x="436" y="248" text-anchor="middle">Go back: an earlier edition is live again</text>
</svg>
