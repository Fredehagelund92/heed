version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The Cube compiler major upgrade changes every change mark and needs its own plan.
      - dependency-name: '@cubejs-backend/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
