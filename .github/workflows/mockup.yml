name: Mockup

# The clickable mockup in apps/mockup, the acceptance specification (apps/mockup/ACCEPTANCE.md). It
# is its own npm package with its own lockfile, so it runs apart from the app's jobs: only when the
# mockup or this workflow changes, on main, or by hand.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mockup/**'
      - '.github/workflows/mockup.yml'
  pull_request:
    paths:
      - 'apps/mockup/**'
      - '.github/workflows/mockup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mockup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mockup:
    name: 'Mockup: typecheck, lint, tests, build, e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mockup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mockup/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint (oxlint, warnings fail it)
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      # The journeys run on the installed Chrome (playwright.config.ts), which the runner image
      # already has: --force installs the current stable over it, with its system dependencies.
      - run: npx playwright install --with-deps --force chrome
      - name: Job specs (J1 to J30) on the production build, then J29 again with reduced motion
        run: npm run e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-mockup
          path: apps/mockup/test-results
          retention-days: 7
