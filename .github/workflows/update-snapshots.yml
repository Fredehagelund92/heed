name: update-snapshots

# Manual. Regenerates the Playwright screenshot baselines on the same runner image the normal CI
# uses and uploads them as an artifact. Nothing is committed automatically: download the
# artifact, review the images, and commit them yourself (see docs/testing.md, "Screenshot baselines").
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Regenerate screenshot baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Update baselines
        run: npx playwright test tests/e2e/screenshots.spec.ts --update-snapshots=all
        env:
          PW_SCREENSHOTS: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-baselines
          path: tests/e2e/__screenshots__
          if-no-files-found: error
          retention-days: 14
