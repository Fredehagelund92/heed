name: Security scanning

# Dependency and secret scanning (NFR-025, NFR-027). The CI workflow calls it on every pull
# request, every push to main and every night, whatever changed, because a new advisory can make
# an unchanged lockfile fail; the CI gate needs both jobs. Run it by hand with workflow_dispatch.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Known vulnerabilities in dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Every installed package carries a valid registry signature (npm audit signatures)
        run: npm audit signatures
      # OSV-Scanner rather than npm audit is the gate, because it records reviewed exceptions
      # with a reason and an expiry date (osv-scanner.toml); npm audit cannot.
      - name: Every locked dependency against OSV, with the reviewed exceptions in osv-scanner.toml
        run: |
          curl -fsSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile package-lock.json --config osv-scanner.toml

  secrets:
    name: Secrets in the history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks over every commit, with the allowlist in .gitleaks.toml
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
