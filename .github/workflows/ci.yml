name: CI

# Which jobs run depends on what changed (docs/development.md, "Validation tiers"): the scope job
# decides, and every job reports. Pushes to main, merge queue entries, the nightly run and the
# full-ci label run everything. "CI gate" passes only when every job passed or was skipped on
# purpose, so it is the one check a branch rule and the merge queue need. No workflow-level path
# filters: a required check that never reports blocks the merge.
on:
  push:
    branches: [main]
  pull_request:
    # labeled: adding the full-ci label runs everything again.
    types: [opened, synchronize, reopened, labeled]
  # A pull request in the merge queue, tested on top of main and the entries ahead of it, so two
  # changes that pass alone but fail together never reach main.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. Pushes to main, merge queue entries and
# the nightly run each get a group of their own, so every one of them finishes.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: What the change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
      check: ${{ steps.scope.outputs.check }}
      code: ${{ steps.scope.outputs.code }}
      mockup: ${{ steps.scope.outputs.mockup }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts/
            apps/mockup/package.json
          sparse-checkout-cone-mode: false
      - name: Sort the changed paths into tiers (.github/scripts/ci-scope.sh)
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FULL_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          export FULL=false MOCKUP_PRESENT=false
          if [ -f apps/mockup/package.json ]; then MOCKUP_PRESENT=true; fi
          paths="$RUNNER_TEMP/changed-paths.txt"
          : > "$paths"
          if [ "$EVENT" != pull_request ] || [ "$FULL_CI_LABEL" = true ]; then
            FULL=true
          else
            # Both names of a renamed file. The list stops at 3,000 files: a longer change runs
            # everything.
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' > "$paths"
            listed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' | wc -l)
            if [ "$listed" -lt "$CHANGED_FILES" ]; then FULL=true; fi
          fi
          echo "Changed paths:"
          # Indented, so that no file name can read as a workflow command.
          sed 's/^/  /' "$paths"
          bash .github/scripts/ci-scope.sh < "$paths" | tee -a "$GITHUB_OUTPUT"

  migrations:
    # Before any database starts: a change whose new migration takes a number its base already has
    # (another pull request merged one first), or shares one, fails here within seconds. It needs
    # only git and node: no install.
    name: Migration numbers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit under test and its first parent: the base branch for a pull request, the
          # queue ahead for a merge queue entry, the commit before for a push.
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Every migration has its own number, after the base branch's (scripts/check-migration-numbers.ts)
        run: node scripts/check-migration-numbers.ts HEAD^1 HEAD

  # The checks run as two jobs side by side, so the slower half sets the wait, not their sum.
  check:
    name: Types, lint, plain words, format
    needs: scope
    if: needs.scope.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint (ESLint with the Tailwind and token guard rails, then Stylelint)
        run: npm run lint
      - name: Plain words (no file gains old words; plain-words.baseline.json, docs/design/voice.md)
        run: npm run lint:words
      - name: Format
        run: npm run format:check

  unit:
    name: Unit tests, build, first load budget, docs site
    needs: scope
    if: needs.scope.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit, service and guard rail tests
        run: npm test
      # npm run size builds the web app as it ships (http mode), as it does locally. The measured
      # sizes, the budget and the margin also go to the job's summary page.
      - name: Build the web app as it ships (http mode) and check the first load budget
        run: npm run size
      - name: Build the docs site (docs/help) and check its pages and index
        run: |
          npm run docs:build
          for f in index get-started tools changelog; do test -s "dist/docs/$f.html"; done
          grep -q '^- \[Privacy\](/docs/privacy): ' dist/docs/llms.txt
          test -s dist/docs/llms-full.txt

  seal:
    # FR-525: a pull request may not change the sealed held-out cases together with src/, nor open
    # them outside the seal's own files (scripts/check-held-out-seal.ts). It needs only git. No
    # cases are sealed at present; the rules on the sealed file hold again once fresh ones are.
    name: Held-out seal
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit under test and its first parent, the base branch (or the queue ahead): their
          # difference is the change.
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: The pull request keeps the held-out cases sealed
        # The base branch's copy of the guard judges the change, so a pull request cannot loosen
        # it; only the pull request that adds the guard runs its own.
        run: |
          if git cat-file -e HEAD^1:scripts/check-held-out-seal.ts 2>/dev/null; then
            git show HEAD^1:scripts/check-held-out-seal.ts > "$RUNNER_TEMP/check-held-out-seal.ts"
          else
            cp scripts/check-held-out-seal.ts "$RUNNER_TEMP/check-held-out-seal.ts"
          fi
          node "$RUNNER_TEMP/check-held-out-seal.ts" HEAD^1 HEAD

  service:
    # Split into parts by test file; each part has its own database.
    name: 'Service integration tests (PostgreSQL 18, part ${{ matrix.shard }} of 2)'
    needs: [scope, migrations]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: context_layer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d context_layer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/context_layer_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: PostgreSQL 18 client tools (pg_dump and pg_restore for the restore drill and the canary)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Integration tests (real database)
        run: |
          pg_dump --version
          npm run test:integration -- --shard=${{ matrix.shard }}/2

  seed:
    # The web app on what `docker compose up` gives a new install: a database prepared as the
    # service image prepares it (db/prepare.ts with SEED_DEMO=on: the demo library, its people,
    # quality history and gaps), the service, and an http mode build of the app.
    name: 'Web app on the demo install (PostgreSQL 18, Playwright)'
    needs: [scope, migrations]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # The local roles have no passwords, so the runner signs in as the container's superuser and
    # takes the role each step needs: the owner migrates, the application role serves.
    env:
      DATABASE_URL_BOOTSTRAP: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_MIGRATE: postgres://postgres:postgres@localhost:5432/heed?options=-c%20role%3Dcontext_layer_owner
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/heed?options=-c%20role%3Dcontext_layer_api
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/heed?options=-c%20role%3Dcontext_layer_api
      E2E_DATABASE_SERVE_URL: postgres://postgres:postgres@localhost:5432/heed?options=-c%20role%3Dcontext_layer_serve
      SEED_DEMO: 'on'
      CUBE_MODEL_DIR: db/seed/cube
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright's browser, cached by the lockfile
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: The database as a new install prepares it (roles, schema, the demo)
        run: npm run db:migrate
      - name: The web app on the demo install
        run: npm run test:e2e:seed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-seed
          path: |
            playwright-report/e2e-seed
            test-results/e2e-seed
          retention-days: 7

  docker:
    # The images docker compose up runs (Dockerfile, compose.yaml): the service, and the web app's
    # http build behind nginx. The web image is started on its own and checked as a browser meets
    # it (scripts/check-web-image.ts). The service image boots as it ships, in production mode, behind
    # the web image, against a stand-in OpenID Connect provider (tests/image/production-boot.sh); then
    # docker compose up starts the demo, as the README's Quick start does.
    name: 'Docker images: build, and boot the service in production mode'
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Build the service and web images
        run: docker compose build
      - name: The web image is healthy, not root, and serves gzip, its headers and real 404s
        run: |
          # No service behind it: "heed" only has to resolve for nginx to start.
          docker run -d --name heed-web-check --add-host heed:127.0.0.1 -p 127.0.0.1:8080:8080 heed-web
          for _ in $(seq 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' heed-web-check)
            [ "$status" = healthy ] && break
            sleep 1
          done
          echo "health: $status"
          [ "$status" = healthy ]
          user=$(docker exec heed-web-check id -u)
          echo "user id: $user"
          [ "$user" != 0 ]
          node scripts/check-web-image.ts http://127.0.0.1:8080
      - name: Boot the service image in production mode, sign a person in and call the MCP server
        run: bash tests/image/production-boot.sh
      - name: Start the demo with docker compose up, in development mode with the people picker
        run: |
          docker compose up --detach --wait --wait-timeout 300
          curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/auth/people | jq -e 'length > 0' > /dev/null
          docker compose logs heed | grep -q '"nodeEnv":"development"'
          docker compose logs heed | grep -q 'Sign-in is the people picker'
      - name: The demo's logs
        if: failure()
        run: docker compose logs --no-color | tail -n 300

  web:
    # The web app on its mock binding (tests/e2e): the golden job specs J1 to J30, with the
    # motion journey a second time under reduced motion, and axe on every place at 390 and 1440 in
    # light and dark. Split into parts that each take a share.
    name: 'Web app: golden job specs and axe on the mock build (part ${{ matrix.shard }} of 3)'
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright's browser, cached by the lockfile
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Golden job specs, the addresses and axe on the production build
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-web-${{ matrix.shard }}
          path: |
            playwright-report/e2e
            test-results/e2e
          retention-days: 7

  golden-http:
    # The golden job specs whose screens are wired (tests/e2e), in http mode: an http mode
    # build of the web app against the service and the mockup's demo week, on a PostgreSQL 18
    # container. Each journey copies the demo week from a template, so within a part they run one
    # at a time; the parts, each with its own database, run side by side.
    name: 'Web app: golden job specs in http mode (PostgreSQL 18, Playwright, part ${{ matrix.shard }} of 3)'
    needs: [scope, migrations]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # The container's superuser creates the roles and the template; each journey's service takes
    # the application role.
    env:
      GOLDEN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright's browser, cached by the lockfile
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Golden job specs in http mode
        run: npm run test:e2e:golden-http -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-golden-http-${{ matrix.shard }}
          path: |
            playwright-report/golden-http
            test-results/golden-http
          retention-days: 7

  mockup:
    # The clickable mockup in apps/mockup, its own npm package with its own lockfile. It runs when
    # the mockup changes and in every full run, once apps/mockup exists.
    name: 'Mockup: typecheck, lint, tests, build, e2e'
    needs: scope
    if: needs.scope.outputs.mockup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mockup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mockup/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      # The journeys run on the installed Chrome, which the runner image already has: --force
      # installs the current stable over it, with its system dependencies.
      - run: npx playwright install --with-deps --force chrome
      - name: Journeys on the production build
        run: npm run e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-mockup
          path: apps/mockup/test-results
          retention-days: 7

  security:
    # Dependencies and secrets (.github/workflows/security.yml): every pull request, every push to
    # main and every night, whatever changed.
    name: Security
    uses: ./.github/workflows/security.yml

  gate:
    # The one required check. Passes when every job passed or was skipped on purpose (the scope
    # job said it was not needed); fails on a failure, a cancel, or a job that should have run and
    # did not.
    name: CI gate
    if: always()
    needs:
      [
        scope,
        migrations,
        check,
        unit,
        seal,
        service,
        seed,
        docker,
        web,
        golden-http,
        mockup,
        security,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped on purpose
        env:
          RESULTS: ${{ toJSON(needs) }}
          IS_CHANGE: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
          CHECK: ${{ needs.scope.outputs.check }}
          CODE: ${{ needs.scope.outputs.code }}
          MOCKUP: ${{ needs.scope.outputs.mockup }}
        run: |
          expect() { # job, whether it should have run
            result=$(jq -r --arg job "$1" '.[$job].result' <<< "$RESULTS")
            if [ "$2" = true ]; then want=success; else want=skipped; fi
            echo "$1: $result (expected $want)"
            if [ "$result" != "$want" ]; then failed=true; fi
          }
          failed=false
          expect scope true
          expect migrations true
          expect security true
          expect seal "$IS_CHANGE"
          expect check "$CHECK"
          expect unit "$CHECK"
          expect service "$CODE"
          expect seed "$CODE"
          expect docker "$CODE"
          expect web "$CODE"
          expect golden-http "$CODE"
          expect mockup "$MOCKUP"
          if [ "$failed" = true ]; then
            echo "::error::A job failed, was cancelled, or did not run when it should have."
            exit 1
          fi
