# The security headers on every answer of the web app. docker/web.conf.template includes this
# file in each location, because a location's add_header replaces the server's. When the image is
# built, scripts/web-csp.ts puts the hash of each script index.html carries inline (the theme,
# vite.config.ts) where INLINE_SCRIPT_HASHES stands, so no other inline script runs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' INLINE_SCRIPT_HASHES; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security $heed_hsts always;
